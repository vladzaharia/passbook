name: PassBookScanner
options:
  bundleIdPrefix: mobile.passbook
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  PassBookScanner:
    type: application
    platform: iOS
    sources:
      - PassBookScanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mobile.passbook.scanner
        INFOPLIST_FILE: PassBookScanner/Info.plist
        CODE_SIGN_ENTITLEMENTS: PassBookScanner/PassBookScanner.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_APP_SANDBOX: YES
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      testTargets: []
