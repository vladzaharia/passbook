[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "passbook-sdk"
version = "0.1.0"
description = "Python client for the PassBook API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27,<1", "pydantic>=2.6,<3", "typing_extensions>=4.7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/passbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
