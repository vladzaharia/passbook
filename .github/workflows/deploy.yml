name: deploy
# Deploys the commit the `ci` workflow just passed on main. Setup and rollback: docs/operations.md, "Automatic deploys".
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  BASE: https://passbook.mobile
  SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  deploy:
    # Only a green push to main; never a pull request.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write # moves the deployed/production tag
      actions: read # reads the ci run's jobs
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set in the production environment. See docs/operations.md, Automatic deploys."
            echo "Deploy skipped: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID missing in the production environment." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.ready == 'true'
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - name: Skip when a newer commit is deployed
        id: order
        if: steps.secrets.outputs.ready == 'true'
        run: |
          git fetch --force --no-tags origin '+refs/tags/deployed/production:refs/tags/deployed/production' || true
          prev=$(git rev-parse -q --verify 'refs/tags/deployed/production^{commit}' || true)
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          if [ -n "$prev" ] && git merge-base --is-ancestor "$SHA" "$prev"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: $SHA is not newer than deployed ${prev}." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.order.outputs.run == 'true'
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        if: steps.order.outputs.run == 'true'
        run: npm ci

      # typecheck, biome and check:rules are not repeated here (3.5 min of a 5 min deploy): the ci run that triggered
      # this deploy ran them on exactly this commit. Prove that from its jobs, then re-run only the cheap gen drift check.
      - name: ci passed for this commit
        id: proof
        if: steps.order.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          [ "$(jq -r .head_sha <<<"$run")" = "$SHA" ] || { echo "::error::ci run $RUN_ID is not for $SHA"; exit 1; }
          [ "$(jq -r .conclusion <<<"$run")" = success ] || { echo "::error::ci run $RUN_ID did not succeed"; exit 1; }
          jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" --jq '.jobs[] | [.name, .conclusion] | @tsv')
          printf '%s\n' "$jobs"
          for j in check coverage-node-merge coverage-worker-merge; do
            printf '%s\n' "$jobs" | grep -qx "$j"$'\tsuccess' || { echo "::error::ci job $j did not succeed for $SHA"; exit 1; }
          done

      - name: Gates
        if: steps.order.outputs.run == 'true'
        # Diff against the commit being deployed, not origin/main: main may have moved on since ci passed.
        env:
          OPENAPI_BASE: ${{ env.SHA }}
          MIGRATIONS_BASE: ${{ env.SHA }}
        run: |
          npm run gen
          test -z "$(git status --porcelain)" || { echo "::error::gen changed files"; git status --porcelain; exit 1; }

      - name: Check wrangler.jsonc and remote secrets
        if: steps.order.outputs.run == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:check -- --secrets

      - name: Build
        if: steps.order.outputs.run == 'true'
        run: |
          npm run build
          test -z "$(git status --porcelain)" || { echo "::error::tree dirty after build"; git status --porcelain; exit 1; }

      # `wrangler deploy` (--first) is the only path that registers new workflows, queue consumers,
      # Durable Object classes and custom domains, so use it when the config adds any since the last deploy.
      - name: Decide --first
        id: first
        if: steps.order.outputs.run == 'true'
        env:
          PREV: ${{ steps.order.outputs.prev }}
        run: |
          flag=""
          if [ -z "$PREV" ]; then
            reasons="no deployed/production tag; treating as first deploy"
          else
            git show "$PREV:wrangler.jsonc" > "$RUNNER_TEMP/wrangler.prev.jsonc"
            reasons=$(node tools/deploy-needs-first.ts "$RUNNER_TEMP/wrangler.prev.jsonc" wrangler.jsonc)
          fi
          if [ -n "$reasons" ]; then flag="--first"; fi
          echo "flag=$flag" >> "$GITHUB_OUTPUT"
          { echo "first<<EOF"; echo "$reasons"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          echo "Deploy flag: ${flag:-none}. ${reasons}"

      - name: Record state before deploy
        id: before
        if: steps.order.outputs.run == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          current_version() {
            npx wrangler deployments list --json 2>/dev/null | node -e '
              let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
                try {
                  const l = JSON.parse(s).sort((a, b) => String(a.created_on).localeCompare(String(b.created_on)));
                  console.log(l.at(-1)?.versions?.[0]?.version_id ?? "unknown");
                } catch { console.log("unknown"); }
              });'
          }
          echo "version=$(current_version)" >> "$GITHUB_OUTPUT"
          pending=$(npx wrangler d1 migrations list passbook-platform --remote 2>&1 | grep -oE '[0-9]{4}_[A-Za-z0-9_]+\.sql' | tr '\n' ' ' || true)
          echo "pending=$pending" >> "$GITHUB_OUTPUT"

      - name: Deploy
        id: deploy
        if: steps.order.outputs.run == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FLAG: ${{ steps.first.outputs.flag }}
        run: |
          set -o pipefail
          # shellcheck disable=SC2086
          npm run deploy -- --apply $FLAG 2>&1 | tee "$RUNNER_TEMP/deploy.log"

      - name: Mark deployed
        if: steps.deploy.outcome == 'success'
        run: |
          git tag -f deployed/production "$SHA"
          git push --force origin refs/tags/deployed/production

      - name: Smoke checks
        id: smoke
        if: steps.deploy.outcome == 'success'
        run: |
          status() { curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$1"; }
          fail=0
          check() { # url expected
            for _ in 1 2 3 4 5 6; do
              got=$(status "$1")
              [ "$got" = "$2" ] && break
              sleep 10
            done
            if [ "$got" = "$2" ]; then echo "ok   $1 $got"; else echo "FAIL $1 expected $2 got $got"; fail=1; fi
          }
          for p in / /door /blueprints /build /access /login /admin /developers /scan; do check "$BASE$p" 200; done
          check "$BASE/api/v1/orgs" 401
          check https://developers.passbook.mobile/ 308
          check https://wallet.plrs.im/ 308
          exit $fail

      - name: Summary
        if: always() && steps.order.outputs.run == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_VERSION: ${{ steps.before.outputs.version }}
          PENDING: ${{ steps.before.outputs.pending }}
          FIRST: ${{ steps.first.outputs.flag }}
          DEPLOYED: ${{ steps.deploy.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          now=$(npx wrangler deployments list --json 2>/dev/null | node -e '
            let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
              try {
                const l = JSON.parse(s).sort((a, b) => String(a.created_on).localeCompare(String(b.created_on)));
                console.log(l.at(-1)?.versions?.[0]?.version_id ?? "unknown");
              } catch { console.log("unknown"); }
            });')
          {
            echo "## Deploy ${SHA:0:9}"
            echo "- Deploy: ${DEPLOYED}; smoke checks: ${SMOKE:-skipped}"
            echo "- Mode: ${FIRST:-versions upload and promote}"
            echo "- Worker version now serving: \`$now\`"
            echo "- Migrations pending before deploy: ${PENDING:-none}"
            if [ "$DEPLOYED" = success ] && [ "$SMOKE" != success ]; then
              echo
              echo "**Smoke checks failed.** Rollback is manual. Migrations are forward-only, so roll forward when you can; the previous version is a degraded fallback:"
              echo
              echo "    npx wrangler rollback ${PREVIOUS_VERSION} --message 'smoke failure ${SHA:0:9}'"
            else
              echo "- Previous version (for \`npx wrangler rollback <id>\`): \`${PREVIOUS_VERSION}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
