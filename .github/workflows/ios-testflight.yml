name: iOS TestFlight
on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (for example 1.0)
        required: true
        default: "1.0"
        type: string
permissions: {}
concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Run end-to-end scanner tests
        run: npm run test:e2e
        env:
          WALLET_E2E_PREVIEW: '1'
  upload:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: xcode-27
    timeout-minutes: 120
    environment: iOS TestFlight
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate signing configuration
        run: |
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "Set the repository variable APPLE_TEAM_ID." >&2; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "Version must be numeric, such as 1.0 or 1.0.1." >&2; exit 1; }
          xcodebuild -version
      - name: Archive and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          : "${ASC_KEY_ID:?Set ASC_KEY_ID in the iOS TestFlight environment.}"
          : "${ASC_ISSUER_ID:?Set ASC_ISSUER_ID in the iOS TestFlight environment.}"
          : "${ASC_KEY_P8_BASE64:?Set ASC_KEY_P8_BASE64 in the iOS TestFlight environment.}"
          secret_dir="$RUNNER_TEMP/passbook-signing"
          archive="$RUNNER_TEMP/PassBookScanner.xcarchive"
          export_dir="$RUNNER_TEMP/PassBookScanner-export"
          key_path="$secret_dir/AuthKey_${ASC_KEY_ID}.p8"
          export_options="$secret_dir/ExportOptions.plist"
          mkdir -p "$secret_dir"
          chmod 700 "$secret_dir"
          trap 'rm -rf "$secret_dir" "$archive" "$export_dir"' EXIT
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          build_number=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          cat > "$export_options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>destination</key><string>upload</string>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild \
            -project ios/PassBookScanner.xcodeproj \
            -scheme PassBookScanner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$build_number" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive
          xcodebuild \
            -exportArchive \
            -archivePath "$archive" \
            -exportPath "$export_dir" \
            -exportOptionsPlist "$export_options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "PassBook Scanner $VERSION ($build_number) uploaded to App Store Connect for TestFlight processing."
