name: iOS TestFlight
on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version X.Y.Z
        required: true
        default: "1.0.0"
        type: string
      testflight_group:
        description: TestFlight beta group (blank uses the PASSBOOK_TESTFLIGHT_GROUP variable; "none" skips)
        required: false
        type: string
      testflight_notes:
        description: What to Test (blank uses the latest commit subjects)
        required: false
        type: string
permissions: {}
concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Run end-to-end scanner tests
        run: npm run test:e2e
        env:
          WALLET_E2E_PREVIEW: '1'
  upload:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: xcode-27
    timeout-minutes: 120
    environment: iOS TestFlight
    permissions:
      contents: read
    env:
      PASSBOOK_XCODE: /Applications/Xcode_27.1.app
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      VERSION: ${{ inputs.version }}
      BUNDLE_ID: mobile.passbook.scanner
    steps:
      - name: Check the configuration
        env:
          GROUP_INPUT: ${{ inputs.testflight_group }}
          GROUP_VAR: ${{ vars.PASSBOOK_TESTFLIGHT_GROUP }}
        run: |
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::Set the APPLE_TEAM_ID repository variable."; exit 1; }
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::Version must be X.Y.Z, such as 1.0.0."; exit 1; }
          group="${GROUP_INPUT:-$GROUP_VAR}"
          [[ "$group" == none ]] && group=""
          echo "GROUP=$group" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 20
          persist-credentials: false
      - name: Build number for this attempt
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          OFFSET: ${{ vars.PASSBOOK_BUILD_NUMBER_OFFSET || '1000' }}
        run: |
          numbers="$(ios/scripts/version.sh --ref "$GITHUB_REF" --version "$VERSION" --run-number "$RUN_NUMBER" \
            --run-attempt "$RUN_ATTEMPT" --offset "$OFFSET" | grep '^build_')"
          printf '%s\n' "$numbers"
          {
            echo "BUILD=$(printf '%s\n' "$numbers" | sed -n 's/^build_number=//p')"
            echo "BUILD_CANDIDATES=$(printf '%s\n' "$numbers" | sed -n 's/^build_candidates=//p')"
          } >> "$GITHUB_ENV"
      - name: What to Test
        env:
          NOTES: ${{ inputs.testflight_notes }}
        run: |
          if [[ -z "$NOTES" ]]; then NOTES="$(git log -n 10 --pretty='- %s')"; fi
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/testflight-notes.txt"
      - name: Select Xcode
        env:
          XCODE_BUILD: ${{ vars.PASSBOOK_RELEASE_XCODE_BUILD }}
        run: ios/scripts/select-xcode.sh --expect-build "$XCODE_BUILD"
      - name: Install XcodeGen
        run: ios/scripts/install-xcodegen.sh
      # Each step that needs the API key runs inside `secrets.sh run`, which writes the key file for that command
      # only and deletes it afterwards. A re-run after an upload that went through finds the build and goes
      # straight to TestFlight instead of uploading a duplicate.
      - name: Look for this run's build in App Store Connect
        id: earlier
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          found="$(ios/scripts/secrets.sh run -- ios/scripts/asc-testflight.sh --bundle-id "$BUNDLE_ID" \
            --version "$VERSION" --find-build "$BUILD_CANDIDATES" | sed -n 's/^found=//p')"
          echo "build=$found" >> "$GITHUB_OUTPUT"
          if [[ -n "$found" ]]; then
            echo "BUILD=$found" >> "$GITHUB_ENV"
            echo "::notice title=Already uploaded::PassBook Scanner $VERSION ($found) is in App Store Connect; skipping the archive and upload"
          fi
      - name: Archive
        if: steps.earlier.outputs.build == ''
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: ios/scripts/secrets.sh run -- ios/scripts/build.sh --archive --marketing-version "$VERSION" --build-number "$BUILD"
      - name: Check the archive
        if: steps.earlier.outputs.build == ''
        run: ios/scripts/check-archive.sh ios/build/PassBookScanner.xcarchive --version "$VERSION" --build "$BUILD"
      - name: Export and upload to App Store Connect
        if: steps.earlier.outputs.build == ''
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: ios/scripts/secrets.sh run -- ios/scripts/build.sh --export upload
      - name: Wait for processing, set What to Test, add to the beta group
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          args=(--bundle-id "$BUNDLE_ID" --version "$VERSION" --build "$BUILD"
                --notes-file "$RUNNER_TEMP/testflight-notes.txt" --timeout 3600)
          if [[ -n "$GROUP" ]]; then args+=(--group "$GROUP"); fi
          ios/scripts/secrets.sh run -- ios/scripts/asc-testflight.sh "${args[@]}"
          echo "PassBook Scanner $VERSION ($BUILD) is on TestFlight${GROUP:+ in the beta group \"$GROUP\"}." >> "$GITHUB_STEP_SUMMARY"
      # A backstop: the key is already gone unless a step was killed.
      - name: Remove secrets
        if: always()
        run: ios/scripts/secrets.sh cleanup
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-testflight-logs
          path: |
            ios/build/ExportOptions.plist
            ios/build/export.log
            ios/build/DerivedData/Logs/
          retention-days: 14
          if-no-files-found: ignore
