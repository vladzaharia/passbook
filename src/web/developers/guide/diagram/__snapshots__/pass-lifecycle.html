<div class="dg-wrap"><figure class="dg dg-flow dg-t520" data-diagram="pass-lifecycle"><svg class="dg-svg" viewBox="0 0 599 272" width="599" height="272" role="img" aria-labelledby="dg-pass-lifecycle-title dg-pass-lifecycle-desc" xmlns="http://www.w3.org/2000/svg"><title id="dg-pass-lifecycle-title">Pass lifecycle</title><desc id="dg-pass-lifecycle-desc">A pass is Active, Voided, Removed or Deleted. void and unvoid move it between Active and Voided. remove and restore move it between Active and Removed. DELETE ends it from any state. update, refresh, renew, new-code and rotate-link leave it Active.</desc><defs><marker id="dg-pass-lifecycle-head" class="dg-marker" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="dg-head" d="M0 0 10 5 0 10z"/></marker><marker id="dg-pass-lifecycle-head-open" class="dg-marker" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="dg-head-open" d="M1 1 8 5 1 9"/></marker></defs><g class="dg-nodes"><g class="dg-node dg-tone-warning"><rect class="dg-box" x="12" y="12" width="140" height="64" rx="12"/><text class="dg-name" x="82" y="39" text-anchor="middle">Voided</text><text class="dg-note" x="82" y="58" text-anchor="middle">scans refused</text></g><g class="dg-node dg-tone-success"><rect class="dg-box" x="220" y="12" width="159" height="64" rx="12"/><text class="dg-name" x="299.5" y="39" text-anchor="middle">Active</text><text class="dg-note" x="299.5" y="58" text-anchor="middle">update, refresh, renew</text></g><g class="dg-node dg-tone-info"><rect class="dg-box" x="447" y="12" width="140" height="64" rx="12"/><text class="dg-name" x="517" y="39" text-anchor="middle">Removed</text><text class="dg-note" x="517" y="58" text-anchor="middle">in Expired passes</text></g><g class="dg-node dg-tone-danger dg-dashed"><rect class="dg-box" x="12" y="196" width="575" height="64" rx="12"/><text class="dg-name" x="299.5" y="223" text-anchor="middle">Deleted</text><text class="dg-note" x="299.5" y="242" text-anchor="middle">record gone, Wallet keeps the pass and sends it no updates</text></g></g><g class="dg-edges"><g class="dg-edge"><line class="dg-line" x1="216" y1="31" x2="156" y2="31" marker-end="url(#dg-pass-lifecycle-head)"/><text class="dg-call" x="186" y="25" text-anchor="middle">void</text></g><g class="dg-edge"><line class="dg-line" x1="156" y1="57" x2="216" y2="57" marker-end="url(#dg-pass-lifecycle-head)"/><text class="dg-call" x="186" y="74" text-anchor="middle">unvoid</text></g><g class="dg-edge"><line class="dg-line" x1="383" y1="31" x2="443" y2="31" marker-end="url(#dg-pass-lifecycle-head)"/><text class="dg-call" x="413" y="25" text-anchor="middle">remove</text></g><g class="dg-edge"><line class="dg-line" x1="443" y1="57" x2="383" y2="57" marker-end="url(#dg-pass-lifecycle-head)"/><text class="dg-call" x="413" y="74" text-anchor="middle">restore</text></g><g class="dg-edge"><line class="dg-line dg-dashed-line" x1="299.5" y1="80" x2="299.5" y2="192" marker-end="url(#dg-pass-lifecycle-head)"/><text class="dg-call" x="309.5" y="140" text-anchor="start">DELETE</text></g><g class="dg-edge"><line class="dg-line dg-dashed-line" x1="82" y1="80" x2="82" y2="192" marker-end="url(#dg-pass-lifecycle-head)"/></g><g class="dg-edge"><line class="dg-line dg-dashed-line" x1="517" y1="80" x2="517" y2="192" marker-end="url(#dg-pass-lifecycle-head)"/></g></g></svg><ol class="dg-list dg-cards" aria-label="Pass lifecycle"><li class="dg-card dg-tone-warning"><span class="dg-name">Voided</span><span class="dg-note">scans refused</span><ul class="dg-outs"><li><code class="dg-call">unvoid</code><span class="dg-to">&rarr; Active</span></li><li><code class="dg-call">DELETE</code><span class="dg-to">&rarr; Deleted</span></li></ul></li><li class="dg-card dg-tone-success"><span class="dg-name">Active</span><span class="dg-note">update, refresh, renew</span><ul class="dg-outs"><li><code class="dg-call">void</code><span class="dg-to">&rarr; Voided</span></li><li><code class="dg-call">remove</code><span class="dg-to">&rarr; Removed</span></li><li><code class="dg-call">DELETE</code><span class="dg-to">&rarr; Deleted</span></li></ul></li><li class="dg-card dg-tone-info"><span class="dg-name">Removed</span><span class="dg-note">in Expired passes</span><ul class="dg-outs"><li><code class="dg-call">restore</code><span class="dg-to">&rarr; Active</span></li><li><code class="dg-call">DELETE</code><span class="dg-to">&rarr; Deleted</span></li></ul></li><li class="dg-card dg-tone-danger dg-dashed"><span class="dg-name">Deleted</span><span class="dg-note">record gone, Wallet keeps the pass and sends it no updates</span></li></ol></figure></div>
